version: '3.4'

services:
  postgres:
    container_name: threads-db
    image: postgres:16-alpine
    ports:
      - 5433:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: threads
      POSTGRES_PASSWORD: threads
      PGDATA: /var/lib/postgresql/data/pgdata

volumes:
  postgres_data: 